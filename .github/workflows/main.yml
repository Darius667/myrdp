name: RDP

on:
  workflow_dispatch:

env:
  RDP_USER: RDP
  RDP_PORT: 3389
  FIREWALL_RULE: RDP-Tailscale
  RDP_UTILS: scripts/RdpUtils.psm1

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - uses: actions/checkout@v4

      - name: Configure Core RDP Settings
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\$env:RDP_UTILS"

          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-TerminalServerValue -Key Server -Name "fDenyTSConnections" -Value 0
          Set-TerminalServerValue -Key RdpTcp -Name "UserAuthentication" -Value 0
          Set-TerminalServerValue -Key RdpTcp -Name "SecurityLayer" -Value 0

          # For testing, allow any incoming connection on the RDP port
          Set-FirewallAllowRule -Name $env:FIREWALL_RULE -Port $env:RDP_PORT

          # (Optional) Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\$env:RDP_UTILS"

          $password = New-RandomPassword
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $env:RDP_USER

          Set-GitHubEnvValue -Name "RDP_CREDS" -Value "User: $env:RDP_USER | Password: $password"

          Assert-Condition -Condition (Get-LocalUser -Name $env:RDP_USER) -Message "User creation failed"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\$env:RDP_UTILS"

          # Bring up Tailscale with the provided auth key and set a unique hostname
          Invoke-Tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = Wait-TailscaleIPv4
          Assert-Condition -Condition $tsIP -Message "Tailscale IP not assigned. Exiting."

          Set-GitHubEnvValue -Name "TAILSCALE_IP" -Value $tsIP

      - name: Verify RDP Accessibility
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\$env:RDP_UTILS"

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          # Test connectivity using Test-NetConnection against the Tailscale IP on the RDP port
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port $env:RDP_PORT
          Assert-Condition -Condition $testResult.TcpTestSucceeded -Message "TCP connection to RDP port $env:RDP_PORT failed"
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_CREDS"
          Write-Host "==================`n"

          # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
