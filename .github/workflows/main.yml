name: Temporary Gaming RDP

on:
  workflow_dispatch:
    inputs:
      username:
        description: Local Windows username
        required: false
        default: rdpuser
        type: string

permissions:
  contents: read
  actions: read

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure Windows Remote Desktop
        shell: powershell
        env:
          RDP_USERNAME: ${{ inputs.username }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD) -or $env:RDP_PASSWORD.Length -lt 12) {
            throw 'Set the RDP_PASSWORD repository secret to a password of at least 12 characters.'
          }
          $env:RDP_USERNAME = $env:RDP_USERNAME.Trim()
          if ($env:RDP_USERNAME -notmatch '^[A-Za-z0-9._-]{1,20}$') {
            throw 'The username may contain only letters, numbers, dot, underscore, and hyphen.'
          }

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $existingUser = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue
          if ($existingUser) {
            Set-LocalUser -Name $env:RDP_USERNAME -Password $securePassword
          } else {
            New-LocalUser -Name $env:RDP_USERNAME -Password $securePassword `
              -AccountNeverExpires -PasswordNeverExpires
          }
          $rdpUsersGroup = (Get-LocalGroup -SID 'S-1-5-32-555').Name
          Add-LocalGroupMember -Group $rdpUsersGroup -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Administrators' -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

      - name: Restore latest game saves
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $runsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?workflow_id=main.yml&status=completed&per_page=20"
          $runs = Invoke-RestMethod -Uri $runsUri -Headers $headers
          $latestArtifact = $null
          foreach ($run in $runs.workflow_runs | Where-Object { $_.id -ne [int64]$env:GITHUB_RUN_ID -and $_.conclusion -eq 'success' }) {
            $artifactsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/artifacts?per_page=100"
            $artifactResponse = Invoke-RestMethod -Uri $artifactsUri -Headers $headers
            $latestArtifact = $artifactResponse.artifacts |
              Where-Object { $_.name -like 'game-saves-*' -and -not $_.expired } |
              Select-Object -First 1
            if ($latestArtifact) { break }
          }

          if (-not $latestArtifact) {
            Write-Host 'No previous game-save backup found; starting with a clean profile.'
            exit 0
          }

          $outerArchive = Join-Path $env:RUNNER_TEMP 'previous-game-saves-artifact.zip'
          Invoke-WebRequest -Uri $latestArtifact.archive_download_url -Headers $headers -OutFile $outerArchive
          $outerDirectory = Join-Path $env:RUNNER_TEMP 'previous-game-saves-artifact'
          Expand-Archive -LiteralPath $outerArchive -DestinationPath $outerDirectory -Force
          $archive = Get-ChildItem -Path $outerDirectory -Filter 'game-saves.zip' -Recurse | Select-Object -First 1
          if (-not $archive) {
            throw 'The previous game-save artifact did not contain game-saves.zip.'
          }

          $saveRoot = Join-Path $env:RUNNER_TEMP 'restored-game-saves'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $saveRoot -Force
          $restoreMap = @{
            'Documents-My-Games' = Join-Path $env:USERPROFILE 'Documents\My Games'
            'Saved-Games'        = Join-Path $env:USERPROFILE 'Saved Games'
            'AppData-Roaming'    = $env:APPDATA
            'AppData-Local'      = $env:LOCALAPPDATA
            'AppData-LocalLow'   = Join-Path $env:USERPROFILE 'AppData\LocalLow'
          }
          foreach ($entry in $restoreMap.GetEnumerator()) {
            $source = Join-Path $saveRoot $entry.Key
            if (Test-Path -LiteralPath $source) {
              New-Item -Path $entry.Value -ItemType Directory -Force | Out-Null
              Copy-Item -Path (Join-Path $source '*') -Destination $entry.Value `
                -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "Restored game saves from artifact $($latestArtifact.name)."

      - name: Install Epic Games Launcher and FiveM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $downloads = Join-Path $env:USERPROFILE 'Downloads'
          New-Item -Path $downloads -ItemType Directory -Force | Out-Null

          $epicInstaller = Join-Path $env:RUNNER_TEMP 'EpicGamesLauncherInstaller.msi'
          Invoke-WebRequest `
            -Uri 'https://launcher-public-service-prod06.ol.epicgames.com/launcher/api/installer/download/EpicGamesLauncherInstaller.msi' `
            -OutFile $epicInstaller
          Start-Process msiexec.exe -Wait -ArgumentList '/i', $epicInstaller, '/qn', '/norestart'
          Remove-Item $epicInstaller -Force

          $fiveM = Join-Path $downloads 'FiveM.exe'
          Invoke-WebRequest -Uri 'https://runtime.fivem.net/client/FiveM.exe' -OutFile $fiveM
          Write-Host "FiveM downloaded to $fiveM."

          $epicPath = @(
            "$env:ProgramFiles(x86)\Epic Games\Launcher\Portal\Binaries\Win64\EpicGamesLauncher.exe",
            "$env:ProgramFiles\Epic Games\Launcher\Portal\Binaries\Win64\EpicGamesLauncher.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $epicPath) {
            throw 'Epic Games Launcher installation did not produce the expected executable.'
          }
          Start-Process -FilePath $epicPath
          Write-Host 'Sign in to Epic Games manually, install GTA V, then run FiveM.exe from Downloads.'

      - name: Optimize runner for gaming
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Use Windows High performance mode and avoid CPU parking/throttling
          # while connected to AC power.
          powercfg /setactive SCHEME_MIN
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMIN 100
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMAX 100
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR SYSTEMCOOLINGPOLICY 1
          powercfg /setactive SCHEME_CURRENT

          # Enable Game Mode and hardware-accelerated GPU scheduling when the
          # runner's Windows build and virtual GPU support them.
          New-Item -Path 'HKCU:\Software\Microsoft\GameBar' -Force | Out-Null
          New-ItemProperty -Path 'HKCU:\Software\Microsoft\GameBar' `
            -Name AutoGameModeEnabled -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers' `
            -Name HwSchMode -PropertyType DWord -Value 2 -Force | Out-Null

          # Remove capture overhead and unnecessary animations for a more
          # responsive remote desktop session.
          New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\GameDVR' `
            -Force | Out-Null
          New-ItemProperty `
            -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\GameDVR' `
            -Name AppCaptureEnabled -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty `
            -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' `
            -Name VisualFXSetting -PropertyType DWord -Value 2 -Force | Out-Null

          # Keep RDP's UDP transport available for lower input latency.
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Force | Out-Null
          New-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Name fClientDisableUDP -PropertyType DWord -Value 0 -Force | Out-Null

      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:TEMP 'tailscale.msi'
          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $installer
          Start-Process msiexec.exe -Wait -ArgumentList '/i', $installer, '/qn', '/norestart'
          Remove-Item $installer -Force

      - name: Connect to Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Set the TAILSCALE_AUTH_KEY repository secret before starting this workflow.'
          }
          $tailscale = Join-Path $env:ProgramFiles 'Tailscale\tailscale.exe'
          & $tailscale up --authkey=$env:TAILSCALE_AUTH_KEY --hostname=github-rdp-$env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) {
            throw 'Tailscale rejected TAILSCALE_AUTH_KEY. Replace the repository secret with a fresh auth key.'
          }
          $ip = $null
          for ($attempt = 0; $attempt -lt 12 -and -not $ip; $attempt++) {
            $ipOutput = & $tailscale ip -4
            if ($LASTEXITCODE -eq 0 -and $ipOutput) {
              $ip = ($ipOutput | Select-Object -First 1).ToString().Trim()
            }
            if (-not $ip) { Start-Sleep -Seconds 5 }
          }
          if (-not $ip) { throw 'Tailscale did not receive an IPv4 address.' }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

      - name: Restrict RDP firewall to Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule
          New-NetFirewallRule -DisplayName 'RDP over Tailscale only' `
            -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' -Profile Any
          if (-not (Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)) {
            throw 'RDP is not listening on the Tailscale interface.'
          }

      - name: Display connection details
        shell: powershell
        env:
          RDP_USERNAME: ${{ inputs.username }}
        run: |
          Write-Host 'RDP is ready (the password is the RDP_PASSWORD repository secret).'
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"

      - name: Keep RDP available
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format o)] RDP active"
            Start-Sleep -Seconds 300
          }

      - name: Collect game saves
        if: ${{ always() }}
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $backup = Join-Path $env:RUNNER_TEMP 'game-saves'
          New-Item -Path $backup -ItemType Directory -Force | Out-Null

          $locations = @(
            @{ Name = 'Documents-My-Games'; Path = Join-Path $env:USERPROFILE 'Documents\My Games' },
            @{ Name = 'Saved-Games'; Path = Join-Path $env:USERPROFILE 'Saved Games' },
            @{ Name = 'AppData-Roaming'; Path = $env:APPDATA },
            @{ Name = 'AppData-Local'; Path = $env:LOCALAPPDATA },
            @{ Name = 'AppData-LocalLow'; Path = Join-Path $env:USERPROFILE 'AppData\LocalLow' }
          )

          foreach ($location in $locations) {
            if (Test-Path -LiteralPath $location.Path) {
              $destination = Join-Path $backup $location.Name
              New-Item -Path $destination -ItemType Directory -Force | Out-Null
              Copy-Item -LiteralPath $location.Path -Destination $destination `
                -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          $archive = Join-Path $env:RUNNER_TEMP 'game-saves.zip'
          Compress-Archive -Path (Join-Path $backup '*') -DestinationPath $archive -CompressionLevel Optimal
          "GAME_SAVES_ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload game saves
        if: ${{ always() && env.GAME_SAVES_ARCHIVE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: game-saves-${{ github.run_id }}
          path: ${{ env.GAME_SAVES_ARCHIVE }}
          retention-days: 90
          if-no-files-found: error
